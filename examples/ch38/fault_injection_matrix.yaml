# Ch38 沙箱故障注入矩阵 (fault_injection_matrix.yaml)
schema_version: "fault-matrix-1.0"
sandbox_scope: "local_tmp_sqlite_only"
stop_conditions:
  - "任何写操作逸出本地临时沙箱目录立即中止"
  - "单次注入导致未授权工单数 > 0 或重复工单数 > 1 立即标记门禁失败并保留现场"

faults:
  - fault_id: "FI-01"
    category: "model_timeout"
    injection_point: "adapter.model.propose"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "拒绝创建意图并记录超时错误，不产生任何外部工单"
    recovery_check: "tickets_count == 0 且会话不进入 completed"

  - fault_id: "FI-02"
    category: "tool_lookup_timeout"
    injection_point: "service.lookup"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "保持 pending 与 outcome_unknown，禁止在未查明旧结果前直接重发 create"
    recovery_check: "tickets_count == 0 且事件含 outcome_unknown"

  - fault_id: "FI-03"
    category: "tool_write_timeout"
    injection_point: "service.create"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "标记 response_unknown，不将超时直接写成业务失败"
    recovery_check: "会话停在 pending(response_unknown)，等待后续核对恢复"

  - fault_id: "FI-04"
    category: "after_commit_crash"
    injection_point: "engine.after_service_commit"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "重启后使用同一稳定 operation_id 先 lookup 再 verify，完成恢复且不重复创建"
    recovery_check: "恢复后 status == completed 且 service.tickets 恰为 1 条"

  - fault_id: "FI-05"
    category: "response_lost"
    injection_point: "engine.response_channel"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "响应丢失后通过幂等 lookup 解析已提交 ticket_id 并完成独立后置验收"
    recovery_check: "status == completed、tickets_count == 1 且事件含 response_unknown"

  - fault_id: "FI-06"
    category: "cancel_after_commit"
    injection_point: "engine.cancel_signal"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "会话进入 cancelled 终态，但如实查验并登记已提交工单，不伪称副作用已撤销"
    recovery_check: "status == cancelled、ticket_id 非空且 service.tickets 保留真实记录"

  - fault_id: "FI-07"
    category: "rate_limit_429"
    injection_point: "adapter.model.rate_limiter"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "有界退避重试并在尝试预算内恢复，超预算则确定性拒绝"
    recovery_check: "尝试次数 <= max_attempts 且最终行为可追溯"

  - fault_id: "FI-08"
    category: "policy_config_drift"
    injection_point: "config.policy_loader"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "配置内容摘要或版本校验拦截漂移，阻断使用错误门槛放行高风险任务"
    recovery_check: "门禁捕获 drift_detected 且高风险切片零越权写入"

  - fault_id: "FI-09"
    category: "trace_field_missing"
    injection_point: "telemetry.exporter"
    blast_radius: "single_sandbox_session"
    expected_safeguard: "可观测断言检查器发现必需 OpenTelemetry GenAI 属性或因果关联缺失并阻断发布"
    recovery_check: "trace_assertion_passed == false 且定位缺失字段名"
