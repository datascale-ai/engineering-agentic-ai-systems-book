<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img"><title>fig-16-02-retrieval-loop</title><desc>固定一次取证；按需路径在材料不足且有预算时改写补检。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="25" y="30" width="1070" height="190" rx="10" fill="none" stroke="#8B99A5" stroke-width="1.5"/><text x="43" y="60" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526373" text-anchor="start" font-weight="600"><tspan x="43" dy="0">固定检索</tspan></text><g id="fixed-q" data-role="node"><rect x="60" y="100" width="180" height="70" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="150.0" y="142.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="150.0" dy="0">问题</tspan></text></g><g id="fixed-r" data-role="node"><rect x="330" y="100" width="180" height="70" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="420.0" y="142.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="420.0" dy="0">一次检索</tspan></text></g><g id="fixed-a" data-role="node"><rect x="600" y="100" width="420" height="70" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="810.0" y="142.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="810.0" dy="0">证据核验 → 回答／不足</tspan></text></g><polyline id="fixed1" data-role="edge" points="240,135 330,135" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="fixed2" data-role="edge" points="510,135 600,135" fill="