<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img"><title>fig-34-02-single-agent-chain</title><desc>申请取证、验收、查询与幂等提交形成闭环，缺少条件则保留。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g id="request" data-role="node"><rect x="30" y="100" width="180" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="120.0" y="136.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="120.0" dy="0">申请</tspan><tspan x="120.0" dy="31.9">类别与批准</tspan></text></g><g id="evidence" data-role="node"><rect x="290" y="100" width="215" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="397.5" y="136.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="397.5" dy="0">当前可读政策</tspan><tspan x="397.5" dy="31.9">原文与额度</tspan></text></g><g id="verify" data-role="node"><rect x="585" y="100" width="215" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="692.5" y="136.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="692.5" dy="0">独立验收</tspan><tspan x="692.5" dy="31.9">条件满足？</tspan></text></g><g id="query" data-role="node"><rect x="880" y="100" width="210" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="985.0" y="152.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="985.0" dy="0">查询已有工单</tspan></text></g><polyline id="read" data-role="edge" poi