<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img"><title>fig-34-03-role-handoff</title><desc>控制器、研究、核验、执行四泳道中的可校验交接。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="110" y="45" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#273442" text-anchor="middle" font-weight="600"><tspan x="110" dy="0">控制器</tspan></text><line x1="110" y1="70" x2="110" y2="560" stroke="#A4AFB8" stroke-dasharray="5 5"/><text x="400" y="45" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#273442" text-anchor="middle" font-weight="600"><tspan x="400" dy="0">研究角色</tspan></text><line x1="400" y1="70" x2="400" y2="560" stroke="#A4AFB8" stroke-dasharray="5 5"/><text x="690" y="45" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#273442" text-anchor="middle" font-weight="600"><tspan x="690" dy="0">核验角色</tspan></text><line x1="690" y1="70" x2="690" y2="560" stroke="#A4AFB8" stroke-dasharray="5 5"/><text x="1000" y="45" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#273442" text-anchor="middle" font-weight="600"><tspan x="1000" dy="0">执行角色</tspan></text><line x1="1000" y1="70" x2="1000" y2="560" stroke="#A4AFB8" stroke-dasharray="5 5"/><polyline id="assign" data-role="edge" points="110,120 400,120" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="255" y="104" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">任务＋世代＋预算</tspan></text><polyline id="submit-evidence" data-role="edge" points="400,225 690,225" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545" y="209" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="545" dy="0">证据卡＋消息信封</tspan></text><polyline id="accept" data-role="edge" points="690,330 1000,330" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="845" y="314" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="845" dy="0">核验结果＋当前版本</tspan></text><polyline id="business-result" data-role="edge" points="1000,445 110,445" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="430" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="560" dy="0">幂等提交后：工单结果与验收事件</tspan></text><polyline id="late" data-role="edge" points="400,530 690,530" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="545" y="515" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="545" dy="0">旧世代结果 → 拒绝，不提交</tspan></text><text x="560" y="595" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="560" dy="0">角色提议不产生批准；最终责任由控制器收口</tspan></text></svg>
