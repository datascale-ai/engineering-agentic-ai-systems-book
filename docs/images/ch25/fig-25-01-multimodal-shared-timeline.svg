<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc">
<title id="title">Fig-25-01 语音、视觉、文件与传感器共享双时钟时间线</title><desc id="desc">对比按到达顺序误绑旧图与按事件时间、轮次和版本精确对齐的融合路径。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#285b8e"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087e82"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a96a16"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b83227"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5c6c80"/></marker>
</defs>
<rect width="1200" height="545" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#203047">
<text x="36" y="46" font-size="25" font-weight="700" fill="#1b2a3d">Fig-25-01 语音、视觉、文件与传感器共享双时钟时间线</text>
<text x="36" y="78" font-size="15" fill="#475569">核心原则：跨模态对齐必须基于物理发生时刻 event_time_ms 与显式版本引用，而非网络到达时刻 receive_time_ms</text>
<text x="36" y="151" font-size="15" font-weight="700" fill="#285b8e">视觉帧 (vision)</text>
<line x1="205" y1="145" x2="1145" y2="145" stroke="#cbd5e1" stroke-width="2"/>
<text x="36" y="261" font-size="15" font-weight="700" fill="#087e82">语音流 (audio/ASR)</text>
<line x1="205" y1="255" x2="1145" y2="255" stroke="#cbd5e1" stroke-width="2"/>
<text x="36" y="371" font-size="15" font-weight="700" fill="#a96a16">文件与传感器</text>
<line x1="205" y1="365" x2="1145" y2="365" stroke="#cbd5e1" stroke-width="2"/>
<text x="36" y="481" font-size="15" font-weight="700" fill="#1b2a3d">共享状态 (state_v)</text>
<line x1="205" y1="475" x2="1145" y2="475" stroke="#cbd5e1" stroke-width="2"/>
<rect x="225" y="118" width="165" height="52" rx="10" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="307.5" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a3d">frame-v1 (旧图)</text>
<text x="307.5" y="174" text-anchor="middle" font-size="12" fill="#2c3e55">et=1000 / rt=1020</text>
<rect x="510" y="118" width="220" height="52" rx="10" fill="#fdf4e7" stroke="#a96a16" stroke-width="2"/>
<text x="620.0" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a3d">frame-v2 (新图·晚到)</text>
<text x="620.0" y="174" text-anchor="middle" font-size="12" fill="#2c3e55">et=1380 / rt=1510 (抖动)</text>
<rect x="445" y="228" width="250" height="52" rx="10" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="570.0" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a3d">“右边这个报销项” (t2)</text>
<text x="570.0" y="284" text-anchor="middle" font-size="12" fill="#2c3e55">et=1400 / rt=1440 · ASR rev=2</text>
<rect x="760" y="338" width="340" height="52" rx="10" fill="#fdf4e7" stroke="#a96a16" stroke-width="2"/>
<text x="930.0" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a3d">policy.pdf@v2 + 传感器读数</text>
<text x="930.0" y="394" text-anchor="middle" font-size="12" fill="#2c3e55">校验 revision 单调与新鲜度 &lt;2000ms</text>
<rect x="740" y="448" width="380" height="58" rx="10" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="930.0" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2a3d">对齐融合结果：绑定 frame-v2 + t2</text>
<text x="930.0" y="504" text-anchor="middle" font-size="12" fill="#2c3e55">按 (turn_id, event_time_ms) 消解指代 · 零误绑</text>
<line x1="445" y1="254" x2="305" y2="170" stroke="#b83227" stroke-width="2.4" marker-end="url(#red)" stroke-dasharray="7 5"/>
<text x="315" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#b83227">按到达顺序→误绑旧图!</text>
<line x1="570" y1="228" x2="620" y2="170" stroke="#087e82" stroke-width="2.4" marker-end="url(#teal)"/>
<text x="675" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#087e82">按 event_time 对齐</text>
<line x1="620" y1="170" x2="860" y2="448" stroke="#285b8e" stroke-width="2.4" marker-end="url(#blue)"/>
<line x1="695" y1="260" x2="880" y2="448" stroke="#087e82" stroke-width="2.4" marker-end="url(#teal)"/>
<line x1="930" y1="390" x2="930" y2="448" stroke="#a96a16" stroke-width="2.4" marker-end="url(#amber)"/>
</g></svg>
