<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Fig-23-02 快照加增量事件回放的重连协调时序</title><desc id="desc">展示断连重发命令命中幂等去重、旧快照检测与缺口补传后通过确定性 reducer 恢复一致终态。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#285b8e"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087e82"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a96a16"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b83227"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5c6c80"/></marker>
</defs>
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#203047">
<text x="36" y="46" font-size="25" font-weight="700" fill="#1b2a3d">Fig-23-02 快照加增量事件回放的重连协调时序</text>
<rect x="45" y="76" width="230" height="48" rx="10" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="160.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3d">客户端 (Reconciler)</text>
<line x1="160" y1="124" x2="160" y2="615" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="455" y="76" width="230" height="48" rx="10" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="570.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3d">权威会话服务端</text>
<line x1="570" y1="124" x2="570" y2="615" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="875" y="76" width="230" height="48" rx="10" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="990.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3d">外部工单服务</text>
<line x1="990" y1="124" x2="990" y2="615" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="160" y1="165" x2="570" y2="165" stroke="#285b8e" stroke-width="2.4" marker-end="url(#blue)"/>
<text x="365.0" y="157.0" text-anchor="middle" font-size="14" font-weight="600" fill="#285b8e">1. Command(cmd_id=cmd-3, op=op-1)</text>
<line x1="570" y1="205" x2="990" y2="205" stroke="#087e82" stroke-width="2.4" marker-end="url(#teal)"/>
<text x="780.0" y="197.0" text-anchor="middle" font-size="14" font-weight="600" fill="#087e82">2. 幂等创建工单 (op-1) → TK-1001</text>
<line x1="990" y1="245" x2="570" y2="245" stroke="#087e82" stroke-width="2.4" marker-end="url(#teal)"/>
<text x="780.0" y="237.0" text-anchor="middle" font-size="14" font-weight="600" fill="#087e82">3. 已提交事实 (seq=4 落盘)</text>
<rect x="270" y="268" width="210" height="34" rx="6" fill="#fbeae8" stroke="#b83227" stroke-width="1.6"/>
<text x="375" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#b83227">网络断连（客户端未收到回执）</text>
<line x1="160" y1="340" x2="570" y2="340" stroke="#a96a16" stroke-width="2.4" marker-end="url(#amber)"/>
<text x="365.0" y="332.0" text-anchor="middle" font-size="14" font-weight="600" fill="#a96a16">4. 重连重发同一 Command(cmd_id=cmd-3)</text>
<line x1="570" y1="382" x2="160" y2="382" stroke="#087e82" stroke-width="2.4" marker-end="url(#teal)"/>
<text x="365.0" y="374.0" text-anchor="middle" font-size="14" font-weight="600" fill="#087e82">5. 命中幂等账本：返回原回执（不再次调用外部服务）</text>
<line x1="160" y1="432" x2="570" y2="432" stroke="#285b8e" stroke-width="2.4" marker-end="url(#blue)"/>
<text x="365.0" y="424.0" text-anchor="middle" font-size="14" font-weight="600" fill="#285b8e">6. 载入旧快照(seq=3)并请求 backfill(after=3)</text>
<line x1="570" y1="476" x2="160" y2="476" stroke="#285b8e" stroke-width="2.4" marker-end="url(#blue)"/>
<text x="365.0" y="468.0" text-anchor="middle" font-size="14" font-weight="600" fill="#285b8e">7. 补传增量事件 seq=4,5,6（自动 v1→v2 迁移）</text>
<rect x="50" y="512" width="320" height="74" rx="10" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="210.0" y="542" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2a3d">确定性 Reducer 重放</text>
<text x="210.0" y="568" text-anchor="middle" font-size="13" fill="#2c3e55">state = reduce(snap@3, ev[4..6])</text>
<text x="210.0" y="590" text-anchor="middle" font-size="13" fill="#2c3e55">终态与权威服务端字节一致 · 零重复写入</text>
</g></svg>
