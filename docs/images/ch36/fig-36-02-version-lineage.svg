<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">结果必须能追溯到实际输入组合</title><desc id="desc">源码、依赖锁、清单和原创夹具汇入内容清单，运行时保存解析后配置和实际环境，再关联状态库、事件与独立验收。Git提交只覆盖已提交内容；内容散列不证明来源可信。</desc>
<defs>
