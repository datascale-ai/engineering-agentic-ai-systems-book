<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img"><title>fig-35-01-evidence-map</title><desc>证据可复现程度与环境覆盖作为两条轴，避免用局部实验推出普遍成熟。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline id="x-axis" data-role="edge" points="130,500 1050,500" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="y-axis" data-role="edge" points="130,500 130,60" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="650" y="565" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="650" dy="0">环境覆盖：固定任务 → 跨任务 → 持续真实环境</tspan></text><text x="245" y="48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#0072B2" text-anchor="middle" font-weight="400"><tspan x="245" dy="0">可重复核验的证据</tspan></text><g id="hypothesis" data-role="node"><rect x="190" y="405" width="260" height="70" rx="8" fill="white" stroke="#273442" stroke-width="2" stroke-dasharray="7 5"/><text x="320.0" y="447.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="320.0" dy="0">E0：拟议研究问题</tspan></text></g><g id="local" data-role="node"><rect x="300" y="295" width="300" height="80" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="450.0" y="342.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">E1：限定环境结果</tspan></text></g><g id="reproduce" data-role="node"><rect x="520" y="185" width="260" height="80" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="650.0" y="232.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="650.0" dy="0">E2：可重复运行</tspan></text></g><g id="field" data-role="node"><rect x="790" y="75" width="270" height="80" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="925.0" y="122.48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="925.0" dy="0">E3：跨环境持续验证</tspan></text></g><text x="650" y="450" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="650" dy="0">本书单机协议结果</tspan><tspan x="650" dy="29.0">不直接移动到“普遍自主”</tspan></text><text x="650" y="610" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="650" dy="0">等级绑定具体主张；图中没有技术效果数值</tspan></text></svg>
