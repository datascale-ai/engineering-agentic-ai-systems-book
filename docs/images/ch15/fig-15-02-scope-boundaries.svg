<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img"><title>fig-15-02-scope-boundaries</title><desc>组织共享、个人与会话作用域相互嵌套，另一个主体不能跨界读取。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="35" width="1060" height="490" rx="10" fill="none" stroke="#8B99A5" stroke-width="1.5"/><text x="48" y="65" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526373" text-anchor="start" font-weight="600"><tspan x="48" dy="0">租户 teaching：组织规则由知识责任人维护</tspan></text><rect x="65" y="100" width="475" height="350" rx="10" fill="none" stroke="#8B99A5" stroke-width="1.5"/><text x="83" y="130" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526373" text-anchor="start" font-weight="600"><tspan x="83" dy="0">主体 u1</tspan></text><rect x="575" y="100" width="475" height="350" rx="10" fill="none" stroke="#8B99A5" stroke-width="1.5"/><text x="593" y="130" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526373" text-anchor="start" font-weight="600"><tspan x="593" dy="0">主体 u2</tspan></text><g id="u1-default" data-role="node"><rect x="95" y="160" width="415" height="75" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="302.5" y="204.98" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="302.5" dy="0">个人默认：上午出发</tspan></text></g><g id="u1-session" data-role="node"><rect x="95" y="300" width="185" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2" stroke-dasharray="7 5"/><text x="187.5" y="336.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="187.5" dy="0">会话 s3</tspan><tspan x="187.5" dy="31.9">临时中午</tspan></text></g><g id="u1-other" data-role="node"><rect x="325" y="300" width="185" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="417.5" y="336.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="417.5" dy="0">会话 s4</tspan><tspan x="417.5" dy="31.9">回退默认</tspan></text></g><polyline id="override" data-role="edge" points="187,300 187,260 300,260 300,235" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="fallback" data-role="edge" points="417,300 417,235" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="u2-default" data-role="node"><rect x="605" y="160" width="415" height="75" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="812.5" y="204.98" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="812.5" dy="0">个人默认：下午出发</tspan></text></g><g id="u2-session" data-role="node"><rect x="720" y="300" width="185" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="812.5" y="336.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="812.5" dy="0">会话 s3</tspan><tspan x="812.5" dy="31.9">使用 u2 默认</tspan></text></g><polyline id="own-default" data-role="edge" points="812,300 812,235" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="490" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="560" dy="0">相同主题与相同会话名，不产生跨主体读取权</tspan></text><text x="560" y="560" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="560" dy="0">临时会话结束后退出覆盖；组织规则不被个人偏好改写</tspan></text></svg>
