<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>fig-15-01-memory-lifecycle</title><desc>候选写入须验证来源与作用域，召回先筛选，删除反馈到派生层。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g id="candidate" data-role="node"><rect x="35" y="170" width="190" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2" stroke-dasharray="7 5"/><text x="130.0" y="206.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="130.0" dy="0">候选记忆</tspan><tspan x="130.0" dy="31.9">原句与来源</tspan></text></g><g id="validation" data-role="node"><rect x="295" y="170" width="205" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="397.5" y="206.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="397.5" dy="0">归属与范围确认</tspan><tspan x="397.5" dy="31.9">允许用途</tspan></text></g><g id="primary" data-role="node"><rect x="575" y="170" width="200" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="675.0" y="206.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="675.0" dy="0">有效主记录</tspan><tspan x="675.0" dy="31.9">修订与期限</tspan></text></g><g id="recall" data-role="node"><rect x="875" y="170" width="205" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="977.5" y="206.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="977.5" dy="0">过滤后排序</tspan><tspan x="977.5" dy="