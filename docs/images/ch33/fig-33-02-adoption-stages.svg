<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img"><title>fig-33-02-adoption-stages</title><desc>阶段验收决定扩大，失败回到修复，停止时保留人工服务。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g id="discover" data-role="node"><rect x="25" y="115" width="190" height="110" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="120.0" y="161.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="120.0" dy="0">发现</tspan><tspan x="120.0" dy="31.9">基线与责任</tspan></text></g><g id="offline" data-role="node"><rect x="245" y="115" width="190" height="110" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="340.0" y="161.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="340.0" dy="0">离线</tspan><tspan x="340.0" dy="31.9">证据与权限</tspan></text></g><polyline id="next1" data-role="edge" points="215,170 245,170" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="shadow" data-role="node"><rect x="465" y="115" width="190" height="110" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="560.0" y="161.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="560.0" dy="0">影子</tspan><tspan x="560.0" dy="31.9">不执行动作</tspan></text></g><polyline id="next2" data-role="edge" points="435,170 465,170" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="pilot" data-role="node"><rect x="685" y="115" width="190" height="110" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="780.0" y="161.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">受控试点</tspan><tspan x="780.0" dy="31.9">批准后行动</tspan></text></g><polyline id="next3" data-role="edge" points="655,170 685,170" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="scale" data-role="node"><rect x="905" y="115" width="190" height="110" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="1000.0" y="161.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="1000.0" dy="0">扩大</tspan><tspan x="1000.0" dy="31.9">分部门验证</tspan></text></g><polyline id="next4" data-role="edge" points="875,170 905,170" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="decision" data-role="node"><rect x="450" y="320" width="220" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="560.0" y="356.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="560.0" dy="0">质量＋总成本</tspan><tspan x="560.0" dy="31.9">继续／暂停／退出</tspan></text></g><polyline id="gate" data-role="edge" points="780,225 780,365 670,365" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="repair" data-role="edge" points="450,365 120,365 120,225" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="280" y="350" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="280" dy="0">修复条件后重新验证</tspan></text><polyline id="expand" data-role="edge" points="670,390 1000,390 1000,225" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="850" y="425" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="850" dy="0">满足约定门槛</tspan></text><text x="560" y="65" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#273442" text-anchor="middle" font-weight="600"><tspan x="560" dy="0">每个阶段都有可执行验收与人工接管路径</tspan></text></svg>
