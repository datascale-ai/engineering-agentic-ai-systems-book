<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img"><title>fig-33-01-enterprise-integration</title><desc>主体身份约束知识和业务，批准独立，审计串联主体、证据与结果。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g id="user" data-role="node"><rect x="35" y="65" width="205" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="137.5" y="101.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="137.5" dy="0">员工请求</tspan><tspan x="137.5" dy="31.9">稳定主体</tspan></text></g><g id="identity" data-role="node"><rect x="325" y="65" width="220" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="435.0" y="101.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="435.0" dy="0">身份与授权</tspan><tspan x="435.0" dy="31.9">角色／撤销版本</tspan></text></g><g id="assistant" data-role="node"><rect x="325" y="265" width="220" height="100" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="435.0" y="306.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="435.0" dy="0">助手控制器</tspan><tspan x="435.0" dy="31.9">证据与任务</tspan></text></g><g id="knowledge" data-role="node"><rect x="650" y="65" width="225" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="762.5" y="101.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="762.5" dy="0">企业知识库</tspan><tspan x="762.5" dy="31.9">版本