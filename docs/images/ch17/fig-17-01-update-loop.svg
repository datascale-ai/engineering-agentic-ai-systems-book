<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img"><title>fig-17-01-update-loop</title><desc>反馈形成诊断与候选，修复和保留集共同验证，再批准发布或拒绝。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#273442" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g id="failure" data-role="node"><rect x="35" y="70" width="210" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="140.0" y="106.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="140.0" dy="0">失败轨迹</tspan><tspan x="140.0" dy="31.9">目标与差异</tspan></text></g><g id="diagnosis" data-role="node"><rect x="320" y="70" width="210" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="425.0" y="106.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">错误诊断</tspan><tspan x="425.0" dy="31.9">新增证据</tspan></text></g><g id="candidate" data-role="node"><rect x="610" y="70" width="210" height="90" rx="8" fill="white" stroke="#273442" stroke-width="2" stroke-dasharray="7 5"/><text x="715.0" y="106.64" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="715.0" dy="0">候选变更</tspan><tspan x="715.0" dy="31.9">范围与版本</tspan></text></g><polyline id="diagnose" data-role="edge" points="245,115 320,115" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="propose" data-role="edge" points="530,115 610,115" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="repair" data-role="node"><rect x="475" y="265" width="210" height="85" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="580.0" y="299.14000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="580.0" dy="0">修复集</tspan><tspan x="580.0" dy="31.9">原失败与近邻</tspan></text></g><g id="holdout" data-role="node"><rect x="785" y="265" width="255" height="85" rx="8" fill="white" stroke="#273442" stroke-width="2"/><text x="912.5" y="299.14000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="912.5" dy="0">保留集</tspan><tspan x="912.5" dy="31.9">旧能力与反例</tspan></text></g><polyline id="repair-test" data-role="edge" points="715,160 715,215 580,215 580,265" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="holdout-test" data-role="edge" points="715,215 912,215 912,265" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="acceptance" data-role="node"><rect x="610" y="440" width="210" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="715.0" y="476.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="715.0" dy="0">接受决定</tspan><tspan x="715.0" dy="31.9">成本与退化</tspan></text></g><polyline id="repair-result" data-role="edge" points="580,350 580,395 680,395 680,440" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><polyline id="holdout-result" data-role="edge" points="912,350 912,395 750,395 750,440" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><g id="publish" data-role="node"><rect x="320" y="440" width="210" height="90" rx="8" fill="#EDF5FA" stroke="#0072B2" stroke-width="2"/><text x="425.0" y="476.64000000000004" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#273442" text-anchor="middle" font-weight="400"><tspan x="425.0" dy="0">分范围发布</tspan><tspan x="425.0" dy="31.9">保留回滚</tspan></text></g><polyline id="publish-update" data-role="edge" points="610,485 530,485" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570" y="470" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="570" dy="0">通过</tspan></text><polyline id="reject" data-role="edge" points="715,530 715,575 140,575 140,160" fill="none" stroke="#273442" stroke-width="1.8" marker-end="url(#arrow)"/><text x="425" y="565" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526373" text-anchor="middle" font-weight="400"><tspan x="425" dy="0">不通过：拒绝／预算内再提议／交接</tspan></text></svg>
