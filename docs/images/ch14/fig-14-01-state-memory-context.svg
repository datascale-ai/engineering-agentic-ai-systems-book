<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">任务状态、工作记忆与模型上下文</title>
  <desc id="desc">权威任务状态经过选择形成工作记忆，再装配为一次模型调用的上下文。模型提出行动建议，执行校验器直接读取任务状态中的当前授权与预算，摘要不产生执行权。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#334155"/></marker>
    <marker id="authority" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#0072B2"/></marker>
    <style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17212b;font-size:21px}.head{font-size:25px;font-weight:600}.small{font-size:18px}.muted{fill:#536171}.box{fill:#fff;stroke:#64748b;stroke-width:1.7}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:#0072B2;stroke-width:3;marker-end:url(#authority)}</style>
  </defs>
  <rect width="1000" height="560" fill="white"/>
  <g id="authoritative-state">
    <rect x="35" y="70" width="270" height="250" rx="5" fill="#eff6fb" stroke="#0072B2" stroke-width="2"/>
    <text x="170" y="112" text-anchor="middle" class="head">任务状态</text>
    <path d="M55 132H285" stroke="#b8cfe0"/>
    <text x="56" y="166">目标与任务修订</text><text x="56" y="203">预算与审批记录</text>
    <text x="56" y="240">来源、版本、有效期</text><text x="56" y="285" class="small muted">受控写入，保存当前业务事实</text>
  </g>
  <g id="working-memory">
    <rect class="box" x="365" y="70" width="270" height="250" rx="5"/>
    <text x="500" y="112" text-anchor="middle" class="head">工作记忆</text>
    <path d="M385 132H615" stroke="#d3dbe3"/>
    <text x="387" y="166">当前相关事实与证据</text><text x="387" y="203">未解决问题与行动候选</text>
    <rect x="385" y="225" width="230" height="73" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="500" y="254" text-anchor="middle">派生摘要</text><text x="500" y="281" text-anchor="middle" class="small muted">保留来源；可重新生成</text>
  </g>
  <g id="call-context">
    <rect class="box" x="695" y="70" width="270" height="250" rx="5"/>
    <text x="830" y="112" text-anchor="middle" class="head">模型上下文</text>
    <path d="M715 132H945" stroke="#d3dbe3"/>
    <text x="717" y="166">策略与当前用户请求</text><text x="717" y="203">选中的工作记忆</text>
    <text x="717" y="240">工具模式与输出约束</text><text x="717" y="285" class="small muted">一次调用的输入，受容量约束</text>
  </g>
  <path class="flow" d="M305 190H365"/><text x="335" y="49" text-anchor="middle" class="small">选择</text>
  <path class="flow" d="M635 190H695"/><text x="665" y="49" text-anchor="middle" class="small">装配</text>
  <g id="model"><rect class="box" x="695" y="390" width="270" height="80" rx="5"/><text x="830" y="438" text-anchor="middle" class="head">模型生成候选行动</text></g>
  <path class="flow" d="M830 320V390"/>
  <g id="action-check"><rect x="365" y="390" width="270" height="80" rx="5" fill="#eff6fb" stroke="#0072B2" stroke-width="2"/><text x="500" y="425" text-anchor="middle" class="head">执行前校验</text><text x="500" y="454" text-anchor="middle" class="small">权限、修订、有效期与金额</text></g>
  <path class="flow" d="M695 430H635"/><text x="664" y="491" text-anchor="middle" class="small">建议</text>
  <path class="control" d="M170 320V430H365"/><text x="190" y="375" class="small">直接重读当前状态</text>
  <text x="500" y="535" text-anchor="middle" class="small muted">实线为读取与计算路径；虚线框为派生内容。模型建议须经执行前校验。</text>
</svg>
