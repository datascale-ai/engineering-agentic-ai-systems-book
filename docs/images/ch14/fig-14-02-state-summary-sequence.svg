<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
  <title id="title">状态更新与摘要生成时序</title>
  <desc id="desc">事件经身份及字段权限校验后，通过带版本条件的事务更新状态。摘要工作者读取第八版状态；新事实先提交为第九版，随后到达的旧摘要因依据过期被拒绝，重新读取后生成。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17212b;font-size:21px}.head{font-size:24px;font-weight:600}.small{font-size:18px}.line{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.reply{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="740" fill="white"/>
  <g id="participants">
    <rect x="35" y="25" width="200" height="65" rx="4" fill="#f8fafc" stroke="#64748b"/><text x="135" y="66" class="head" text-anchor="middle">可信事件来源</text>
    <rect x="300" y="25" width="200" height="65" rx="4" fill="#eff6fb" stroke="#0072B2"/><text x="400" y="66" class="head" text-anchor="middle">状态服务</text>
    <rect x="565" y="25" width="200" height="65" rx="4" fill="#eff6fb" stroke="#0072B2"/><text x="665" y="66" class="head" text-anchor="middle">状态存储</text>
    <rect x="830" y="25" width="235" height="65" rx="4" fill="#f8fafc" stroke="#64748b"/><text x="947" y="66" class="head" text-anchor="middle">摘要工作者</text>
    <path d="M135 90V670M400 90V670M665 90V670M947 90V670" stroke="#cbd5e1" stroke-dasharray="5 6"/>
  </g>
  <g id="fact-commit">
    <path class="line" d="M135 150H400"/><text x="267" y="134" text-anchor="middle">新事件，预期版本 7</text>
    <rect x="290" y="173" width="220" height="45" fill="#f8fafc" stroke="#64748b"/><text x="400" y="202" text-anchor="middle" class="small">身份、字段、来源校验</text>
    <path class="line" d="M400 255H665"/><text x="532" y="239" text-anchor="middle">条件更新并登记事件</text>
    <path class="reply" d="M665 305H400"/><text x="532" y="291" text-anchor="middle" class="small">提交版本 8，事实修订 4</text>
  </g>
  <g id="summary-generation">
    <path class="line" d="M665 365H947"/><text x="806" y="348" text-anchor="middle">读取快照 v8 / r4</text>
    <path class="line" d="M135 422H400"/><text x="267" y="405" text-anchor="middle">随后到达的新事实</text>
    <path class="line" d="M400 470H665"/><text x="532" y="453" text-anchor="middle">提交版本 9，事实修订 5</text>
    <path class="line" d="M947 530H400"/><text x="674" y="513" text-anchor="middle">提交基于 v8 / r4 生成的摘要</text>
    <path class="reply" d="M400 590H947"/><text x="674" y="574" text-anchor="middle">依据已过期，拒绝发布并要求重读</text>
    <rect x="450" y="618" width="460" height="43" fill="#fff7ed" stroke="#a16207"/><text x="680" y="646" text-anchor="middle" class="small">新事实保持有效；旧摘要不能覆盖当前状态</text>
  </g>
  <text x="550" y="711" text-anchor="middle" class="small" fill="#536171">v 表示状态版本，r 表示事实修订。摘要生成在事务之外，发布时再次检查依据。</text>
</svg>
