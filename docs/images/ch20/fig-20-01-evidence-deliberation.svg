<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">共同判断以证据收口，不以一致代替核验</title><desc id="desc">独立候选先保存，再交换主张与证据并定向质疑。按规则聚合后进行独立核验，输出结论或分歧报告。未决问题只有在新增证据且预算允许时继续；所有路径受根预算与截止约束。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#285b8e"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087e82"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a96a16"/></marker>
</defs>
<rect width="1200" height="1100" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#203047">
<text x="40" y="48" font-size="29" text-anchor="start" fill="#203047" font-weight="700">共同判断以证据收口，不以一致代替核验</text>
<text x="600" y="90" font-size="21" text-anchor="middle" fill="#203047">任务、事实修订、证据范围与根预算先固定</text>
<rect x="70" y="125" width="300" height="106" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="220.0" y="159" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">成员甲</text>
<text x="220.0" y="190" font-size="20" text-anchor="middle" fill="#203047">先形成候选 A</text>
<text x="220.0" y="218" font-size="20" text-anchor="middle" fill="#203047">保存引用与未知项</text>
<rect x="450" y="125" width="300" height="106" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="600.0" y="159" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">成员乙</text>
<text x="600.0" y="190" font-size="20" text-anchor="middle" fill="#203047">先形成候选 B</text>
<text x="600.0" y="218" font-size="20" text-anchor="middle" fill="#203047">保存引用与未知项</text>
<rect x="830" y="125" width="300" height="106" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="980.0" y="159" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">成员丙</text>
<text x="980.0" y="190" font-size="20" text-anchor="middle" fill="#203047">先形成候选 C</text>
<text x="980.0" y="218" font-size="20" text-anchor="middle" fill="#203047">保存引用与未知项</text>
<path d="M220 231V265H600V300" fill="none" stroke="#285b8e" stroke-width="2.8" marker-end="url(#blue)"/>
<path d="M600 231V300" fill="none" stroke="#285b8e" stroke-width="2.8" marker-end="url(#blue)"/>
<path d="M980 231V265H600" fill="none" stroke="#285b8e" stroke-width="2.8"/>
<rect x="310" y="300" width="580" height="115" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="600.0" y="334" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">证据交换与定向质疑</text>
<text x="600.0" y="365" font-size="20" text-anchor="middle" fill="#203047">主张 → 出处／版本 → 适用条件</text>
<text x="600.0" y="393" font-size="20" text-anchor="middle" fill="#203047">检查反证，回应后修订或撤回</text>
<path d="M600 415V462" fill="none" stroke="#285b8e" stroke-width="2.8" marker-end="url(#blue)"/>
<rect x="310" y="462" width="580" height="115" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="600.0" y="496" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">按既定规则聚合／裁决</text>
<text x="600.0" y="527" font-size="20" text-anchor="middle" fill="#203047">票数、证据效力与资源协商分开</text>
<text x="600.0" y="555" font-size="20" text-anchor="middle" fill="#203047">未决主张保留责任和处理状态</text>
<path d="M600 577V624" fill="none" stroke="#285b8e" stroke-width="2.8" marker-end="url(#blue)"/>
<rect x="310" y="624" width="580" height="115" rx="12" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="600.0" y="658" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">独立核验当前候选</text>
<text x="600.0" y="689" font-size="20" text-anchor="middle" fill="#203047">核对答案标准、关键条件与反证响应</text>
<text x="600.0" y="717" font-size="20" text-anchor="middle" fill="#203047">裁判整理不等于业务执行授权</text>
<path d="M600 739V793" fill="none" stroke="#087e82" stroke-width="2.8" marker-end="url(#teal)"/>
<rect x="310" y="793" width="580" height="115" rx="12" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="600.0" y="827" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">交付结论或分歧报告</text>
<text x="600.0" y="858" font-size="20" text-anchor="middle" fill="#203047">结论、适用范围、未决项、停止原因</text>
<text x="600.0" y="886" font-size="20" text-anchor="middle" fill="#203047">最终负责者与后续接管路径</text>
<path d="M890 680H1060V355H890" fill="none" stroke="#a96a16" stroke-width="2.8" marker-end="url(#amber)" stroke-dasharray="8 6"/>
<text x="975" y="475" font-size="19" text-anchor="middle" fill="#a96a16">有新证据</text>
<text x="975" y="506" font-size="19" text-anchor="middle" fill="#a96a16">且预算允许</text>
<rect x="70" y="956" width="1060" height="100" rx="12" fill="#f6f8fb" stroke="#a6b4c4" stroke-width="2"/>
<text x="600.0" y="990" font-size="23" text-anchor="middle" fill="#203047" font-weight="700">继续、弃权与退出都受同一根预算和截止限制</text>
<text x="600.0" y="1021" font-size="20" text-anchor="middle" fill="#203047">无新增证据／关键事实缺失／超限 → 记录未决并有界交接</text>
</g></svg>
