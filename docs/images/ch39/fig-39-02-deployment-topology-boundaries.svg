<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Fig-39-02 Local、Test 与 Staging 三档部署拓扑及身份/数据/网络边界</title><desc id="desc">并列比较三档环境的制品、身份、秘密、数据、网络与可观测边界。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#285b8e"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087e82"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a96a16"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b83227"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5c6c80"/></marker>
</defs>
<rect width="1200" height="470" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#203047">
<text x="36" y="46" font-size="25" font-weight="700" fill="#1b2a3d">Fig-39-02 Local、Test 与 Staging 三档部署拓扑及身份/数据/网络边界</text>
<rect x="45" y="100" width="350" height="290" rx="10" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="220.0" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3d">Local 本地档位</text>
<text x="220.0" y="156" text-anchor="middle" font-size="14" fill="#2c3e55">制品：本地工作区 + run_manifest.toml</text>
<text x="220.0" y="178" text-anchor="middle" font-size="14" fill="#2c3e55">身份：trusted_local_driver（无认证）</text>
<text x="220.0" y="200" text-anchor="middle" font-size="14" fill="#2c3e55">秘密：零密钥（纯离线确定性 mock）</text>
<text x="220.0" y="222" text-anchor="middle" font-size="14" fill="#2c3e55">数据：隔离 tmp 目录 SQLite</text>
<text x="220.0" y="244" text-anchor="middle" font-size="14" fill="#2c3e55">网络：deny_all（完全离线）</text>
<text x="220.0" y="266" text-anchor="middle" font-size="14" fill="#2c3e55">观测：本地 JSONL 事件日志</text>
<rect x="425" y="100" width="350" height="290" rx="10" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="600.0" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3d">Test 测试沙箱档位</text>
<text x="600.0" y="156" text-anchor="middle" font-size="14" fill="#2c3e55">制品：CI 不可变构建包 + SHA-256</text>
<text x="600.0" y="178" text-anchor="middle" font-size="14" fill="#2c3e55">身份：临时只读 CI 服务账号</text>
<text x="600.0" y="200" text-anchor="middle" font-size="14" fill="#2c3e55">秘密：掩码环境变量 + TA-04 扫描</text>
<text x="600.0" y="222" text-anchor="middle" font-size="14" fill="#2c3e55">数据：每任务新建沙箱库，跑完销毁</text>
<text x="600.0" y="244" text-anchor="middle" font-size="14" fill="#2c3e55">网络：仅 loopback mock 服务</text>
<text x="600.0" y="266" text-anchor="middle" font-size="14" fill="#2c3e55">观测：JUnit + OTel Span + 回归报告</text>
<rect x="805" y="100" width="350" height="290" rx="10" fill="#fdf4e7" stroke="#a96a16" stroke-width="2"/>
<text x="980.0" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3d">Staging 预发布档位</text>
<text x="980.0" y="156" text-anchor="middle" font-size="14" fill="#2c3e55">制品：签名发布包（代码+配置+模式）</text>
<text x="980.0" y="178" text-anchor="middle" font-size="14" fill="#2c3e55">身份：作用域租户令牌 + 审批服务</text>
<text x="980.0" y="200" text-anchor="middle" font-size="14" fill="#2c3e55">秘密：Secret Manager 注入不落盘</text>
<text x="980.0" y="222" text-anchor="middle" font-size="14" fill="#2c3e55">数据：预发布独立库 + 回滚前快照</text>
<text x="980.0" y="244" text-anchor="middle" font-size="14" fill="#2c3e55">网络：仅白名单预发布依赖出站</text>
<text x="980.0" y="266" text-anchor="middle" font-size="14" fill="#2c3e55">观测：SLO 仪表板 + 审计 + 回滚演练</text>
<line x1="395" y1="245" x2="425" y2="245" stroke="#285b8e" stroke-width="2.4" marker-end="url(#blue)"/>
<line x1="775" y1="245" x2="805" y2="245" stroke="#087e82" stroke-width="2.4" marker-end="url(#teal)"/>
<text x="600" y="438" text-anchor="middle" font-size="15" fill="#a96a16">边界声明：三档部署边界沿用附录 D；预发布演练不替代真实生产集群容灾、跨区多活或真实组织 IAM 治理</text>
</g></svg>
