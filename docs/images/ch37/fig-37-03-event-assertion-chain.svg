<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc">
<title id="title">验收链跨过写入、未知结果与恢复边界</title><desc id="desc">客户端先保存稳定意图，服务原子记录唯一作用和created事件。提交后响应丢失留pending，恢复查询相同操作。独立确认载荷与批准摘要后才完成；取消保留实际副作用并阻止继续。此图表示事件依赖不表示耗时比例。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#285b8e"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087e82"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a96a16"/></marker>
</defs>
<rect width="1200" height="1170" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#203047">
<text x="40" y="48" text-anchor="start" font-size="28" fill="#203047" font-weight="700">验收链跨过写入、未知结果与恢复边界</text>
<rect x="70" y="115" width="740" height="115" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="440.0" y="149" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">intent_saved：稳定 operation ID 已持久化</text>
<text x="440.0" y="181" text-anchor="middle" font-size="20" fill="#203047">批准范围绑定目标载荷</text>
<rect x="70" y="285" width="740" height="115" rx="12" fill="#e4edf7" stroke="#285b8e" stroke-width="2"/>
<text x="440.0" y="319" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">action_requested → 服务原子提交</text>
<text x="440.0" y="351" text-anchor="middle" font-size="20" fill="#203047">tickets 唯一作用＋service_events.created</text>
<rect x="70" y="455" width="740" height="115" rx="12" fill="#fff2dc" stroke="#a96a16" stroke-width="2"/>
<text x="440.0" y="489" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">响应未知：客户端仍为 pending</text>
<text x="440.0" y="521" text-anchor="middle" font-size="20" fill="#203047">中断后重新打开状态；查询原 operation ID</text>
<rect x="70" y="625" width="740" height="115" rx="12" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="440.0" y="659" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">outcome_resolved → postcondition_verified</text>
<text x="440.0" y="691" text-anchor="middle" font-size="20" fill="#203047">独立读载荷、批准摘要、数量和事件顺序</text>
<rect x="70" y="795" width="740" height="115" rx="12" fill="#e4f3f0" stroke="#087e82" stroke-width="2"/>
<text x="440.0" y="829" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">completed：业务后置条件成立</text>
<text x="440.0" y="861" text-anchor="middle" font-size="20" fill="#203047">无法核实则保留 pending，不能伪填成功</text>
<path d="M440 230V285" fill="none" stroke="#285b8e" stroke-width="2.8" marker-end="url(#blue)"/>
<path d="M440 400V455" fill="none" stroke="#285b8e" stroke-width="2.8" marker-end="url(#blue)"/>
<path d="M440 570V625" fill="none" stroke="#087e82" stroke-width="2.8" marker-end="url(#teal)"/>
<path d="M440 740V795" fill="none" stroke="#087e82" stroke-width="2.8" marker-end="url(#teal)"/>
<rect x="875" y="455" width="275" height="285" rx="12" fill="#fff2dc" stroke="#a96a16" stroke-width="2"/>
<text x="1012.5" y="489" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">取消分支</text>
<text x="1012.5" y="521" text-anchor="middle" font-size="20" fill="#203047">不再发新动作</text>
<text x="1012.5" y="549" text-anchor="middle" font-size="20" fill="#203047">已提交作用仍保留</text>
<text x="1012.5" y="577" text-anchor="middle" font-size="20" fill="#203047">查询并记录实际结果</text>
<text x="1012.5" y="605" text-anchor="middle" font-size="20" fill="#203047">状态保持 cancelled</text>
<text x="1012.5" y="633" text-anchor="middle" font-size="20" fill="#203047">不生成 completed</text>
<path d="M810 340H1012V455" fill="none" stroke="#a96a16" stroke-width="2.8" marker-end="url(#amber)"/>
<rect x="70" y="995" width="1080" height="100" rx="12" fill="#f6f8fb" stroke="#a6b4c4" stroke-width="2"/>
<text x="610.0" y="1029" text-anchor="middle" font-size="23" fill="#203047" font-weight="700">断言依据是事件偏序与持久事实；不要求所有实现具有完全相同的日志文本</text>
<text x="610.0" y="1061" text-anchor="middle" font-size="20" fill="#203047">测试后关闭句柄、隔离目录，避免旧会话污染下一用例</text>
</g></svg>
